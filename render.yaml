# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: riseup-connector
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Random secret generated by Render; seals the OAuth tokens. PUBLIC_URL is
      # taken from RENDER_EXTERNAL_URL automatically.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Password asked on the sign-in page (pick your own when prompted).
      - key: CONNECT_PASSWORD
        sync: false
